name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  # 允许手动在 GitHub 页面上触发工作流
  workflow_dispatch:

# 设置部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 保证同一时间只有一个部署任务进行
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 安装依赖
        run: npm ci

      - name: 构建生产包
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
